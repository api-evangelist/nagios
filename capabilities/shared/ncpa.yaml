name: ncpa
title: NCPA Capabilities
description: Per-agent capabilities exposed by the Nagios Cross-Platform Agent.
provider: nagios
api: ncpa
specification: openapi/ncpa-openapi.yml
capabilities:
  - id: poll-cpu
    title: Poll CPU
    description: Retrieve CPU utilization, optionally with warning/critical thresholds and Nagios check formatting.
    operation: getCpuPercent
    method: GET
    path: /cpu/percent
    tags: [Read, Telemetry]
  - id: poll-memory
    title: Poll Memory
    description: Retrieve virtual memory metrics in selected units.
    operation: getMemoryVirtual
    method: GET
    path: /memory/virtual
    tags: [Read, Telemetry]
  - id: poll-disk
    title: Poll Disk
    description: Retrieve logical disk capacity and free space.
    operation: getDiskLogical
    method: GET
    path: /disk/logical
    tags: [Read, Telemetry]
  - id: poll-interface
    title: Poll Network Interfaces
    description: Read network interface counters with optional per-second delta.
    operation: getInterface
    method: GET
    path: /interface
    tags: [Read, Telemetry]
  - id: poll-services
    title: Poll Services
    description: Retrieve the running state of host services / daemons.
    operation: listServices
    method: GET
    path: /services
    tags: [Read, Telemetry]
  - id: run-plugin
    title: Run Plugin
    description: Execute a registered NCPA plugin and return Nagios-formatted check output.
    operation: runPlugin
    method: GET
    path: /plugins/{pluginName}
    tags: [Execute, Plugin]
