apis:
- aid: nagios:nsca
  name: NSCA (Nagios Service Check Acceptor)
  description: >-
    Encrypted binary TCP daemon (default port 5667) that accepts passive service/host check results from
    remote machines. Not REST — clients send tab-delimited records over a shared-secret-encrypted socket.
    Use NRDP for an HTTP/JSON equivalent.
  humanURL: https://github.com/NagiosEnterprises/nsca
  baseURL: tcp://{nsca-host}:5667
  tags:
  - Monitoring
  - Passive Check
  - Binary Protocol
  - NSCA
  properties:
  - type: GitHub
    url: https://github.com/NagiosEnterprises/nsca
- aid: nagios:nrpe
  name: NRPE (Nagios Remote Plugin Executor)
  description: >-
    Daemon that runs Nagios plugins on a remote Linux/Unix host on TCP port 5666, returning the plugin's
    exit code and output to the Nagios server. Binary protocol, not REST.
  humanURL: https://github.com/NagiosEnterprises/nrpe
  baseURL: tcp://{nrpe-host}:5666
  tags:
  - Monitoring
  - Active Check
  - Binary Protocol
  - NRPE
  properties:
  - type: GitHub
    url: https://github.com/NagiosEnterprises/nrpe
