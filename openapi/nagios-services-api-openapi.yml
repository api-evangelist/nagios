openapi: 3.2.0
info:
  title: NCPA (Nagios Cross-Platform Agent) Services API
  description: 'REST API exposed by the Nagios Cross-Platform Agent (NCPA) running on

    Linux, Windows, or macOS. The API uses a hierarchical node-based URL

    structure (`/api/{module}/{node1}/{node2}`) and is authenticated by a

    `token` query parameter matching the `community_string` in the agent

    config. Both active polls and Nagios-style passive check results are

    supported.

    '
  version: 3.x
  contact:
    name: Nagios Enterprises
    url: https://www.nagios.org/ncpa/
servers:
- url: https://{ncpaHost}:5693/api
  description: NCPA agent listening on default TLS port 5693.
  variables:
    ncpaHost:
      default: localhost
security:
- TokenAuth: []
tags:
- name: Services
  description: Host service / daemon status.
paths:
  /services:
    get:
      tags:
      - Services
      summary: List Services
      operationId: listServices
      parameters:
      - $ref: '#/components/parameters/Token'
      - name: service
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - running
          - stopped
      responses:
        '200':
          description: Service status.
components:
  parameters:
    Token:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: NCPA community_string token from agent config.
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: query
      name: token
