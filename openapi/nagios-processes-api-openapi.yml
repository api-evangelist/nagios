openapi: 3.2.0
info:
  title: NCPA (Nagios Cross-Platform Agent) Processes API
  description: 'REST API exposed by the Nagios Cross-Platform Agent (NCPA) running on

    Linux, Windows, or macOS. The API uses a hierarchical node-based URL

    structure (`/api/{module}/{node1}/{node2}`) and is authenticated by a

    `token` query parameter matching the `community_string` in the agent

    config. Both active polls and Nagios-style passive check results are

    supported.

    '
  version: 3.x
  contact:
    name: Nagios Enterprises
    url: https://www.nagios.org/ncpa/
servers:
- url: https://{ncpaHost}:5693/api
  description: NCPA agent listening on default TLS port 5693.
  variables:
    ncpaHost:
      default: localhost
security:
- TokenAuth: []
tags:
- name: Processes
  description: Running process inventory and resource use.
paths:
  /processes:
    get:
      tags:
      - Processes
      summary: List Processes
      operationId: listProcesses
      parameters:
      - $ref: '#/components/parameters/Token'
      - name: name
        in: query
        schema:
          type: string
      - name: exe
        in: query
        schema:
          type: string
      - name: cmd
        in: query
        schema:
          type: string
      - name: mem_percent
        in: query
        schema:
          type: number
      - name: cpu_percent
        in: query
        schema:
          type: number
      responses:
        '200':
          description: Process list.
components:
  parameters:
    Token:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: NCPA community_string token from agent config.
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: query
      name: token
